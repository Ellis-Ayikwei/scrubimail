<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Scrubi | Secure Authentication</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "surface-container-lowest": "#0a0f13",
                    "tertiary-fixed": "#e2e2e2",

                    "on-tertiary-fixed": "#1a1c1c",
                    "tertiary-container": "#c9c9c9",
                    "inverse-primary": "#006c49",
                    "tertiary-fixed-dim": "#c6c6c7",
                    "secondary": "#c2c7d0",
                    "inverse-on-surface": "#2d3135",
                    "on-error": "#690005",
                    "primary-fixed-dim": "#00e29e",
                    "on-secondary-fixed": "#171c23",
                    "on-secondary-fixed-variant": "#42474f",
                    "error-container": "#93000a",

                    "on-primary": "#003824",
                    "on-error-container": "#ffdad6",
                    "secondary-fixed": "#dee2ec",
                    "on-primary-fixed": "#002114",
                    "secondary-container": "#42474f",
                    "on-surface-variant": "#bacbbf",

                    "error": "#ffb4ab",
                    "surface-dim": "#101418",

                    "on-tertiary": "#2f3131",

                    "body": ["Inter", "sans-serif"],
                    "label": ["Space Grotesk", "monospace"]

        },
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .grid-bg {
            background-image: linear-gradient(to right, rgba(110, 255, 192, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(110, 255, 192, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .glow-overlay {
            background: radial-gradient(circle at center, rgba(0, 229, 160, 0.08) 0%, transparent 70%);
        }
    </style>

<body class="bg-surface-dim text-on-surface font-body min-h-screen selection:bg-primary selection:text-on-primary overflow-hidden flex flex-col">
<!-- Background Layers -->
<div class="fixed inset-0 grid-bg pointer-events-none"></div>
<div class="fixed inset-0 glow-overlay pointer-events-none"></div>
<!-- Minimal Shell (Navigation Suppressed for focused task) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 py-6 max-w-screen-2xl mx-auto">
<div class="text-2xl font-headline font-black tracking-tighter text-primary">
            Scrubi
        </div>
<div class="font-label uppercase tracking-widest text-xs text-outline">
            Terminal Access / 2FA
        </div>
</header>
<main class="flex-grow flex items-center justify-center p-6 relative z-10">
<!-- Auth Card -->
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant/15 p-8 shadow-2xl relative">
<!-- Terminal Header -->
<div class="absolute top-0 left-0 w-full h-1 bg-surface-container-highest flex items-center px-3 gap-1">
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant/30"></div>
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant/30"></div>
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant/30"></div>
</div>
<div class="mt-4">
<h1 class="text-3xl font-headline font-bold text-on-surface mb-2 tracking-tight">Two-Factor Authentication</h1>
<p class="text-on-surface-variant font-body text-sm leading-relaxed">
                    Enter the 6-digit code from your authenticator app
                </p>
</div>
<!-- Toggle Switchers -->
<div class="flex mt-8 mb-8 bg-surface-container-low p-1 rounded-sm">
<button class="flex-1 py-2 text-xs font-label uppercase tracking-wider bg-primary-container text-on-primary-container font-bold shadow-sm">
                    Authenticator App
                </button>
<button class="flex-1 py-2 text-xs font-label uppercase tracking-wider text-outline hover:text-on-surface transition-colors">
                    Backup Code
                </button>
</div>
<!-- OTP Input Group -->
<form class="space-y-8">
<div aria-label="6-digit verification code" class="flex justify-between gap-2 md:gap-3">
<input class="w-12 h-16 md:w-14 md:h-20 text-center text-2xl font-label bg-surface-container-highest border-b-2 border-transparent focus:border-primary focus:ring-0 text-primary transition-all outline-none" maxlength="1" type="text" value="4"/>
<input class="w-12 h-16 md:w-14 md:h-20 text-center text-2xl font-label bg-surface-container-highest border-b-2 border-transparent focus:border-primary focus:ring-0 text-primary transition-all outline-none" maxlength="1" type="text" value="8"/>
<input autofocus="" class="w-12 h-16 md:w-14 md:h-20 text-center text-2xl font-label bg-surface-container-highest border-b-2 border-primary focus:ring-0 text-primary transition-all outline-none" maxlength="1" placeholder="0" type="text"/>
<input class="w-12 h-16 md:w-14 md:h-20 text-center text-2xl font-label bg-surface-container-highest border-b-2 border-transparent focus:border-primary focus:ring-0 text-primary transition-all outline-none" maxlength="1" placeholder="0" type="text"/>
<input class="w-12 h-16 md:w-14 md:h-20 text-center text-2xl font-label bg-surface-container-highest border-b-2 border-transparent focus:border-primary focus:ring-0 text-primary transition-all outline-none" maxlength="1" placeholder="0" type="text"/>
<input class="w-12 h-16 md:w-14 md:h-20 text-center text-2xl font-label bg-surface-container-highest border-b-2 border-transparent focus:border-primary focus:ring-0 text-primary transition-all outline-none" maxlength="1" placeholder="0" type="text"/>
</div>
<div class="space-y-4">
<button class="w-full py-4 bg-primary-container text-on-primary-container font-headline font-bold text-sm uppercase tracking-widest hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(0,229,160,0.2)]" type="submit">
                        Verify &amp; Sign In
                        <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
<button class="w-full py-4 bg-transparent border border-outline/20 text-outline font-label text-xs uppercase tracking-widest hover:border-outline/50 hover:text-on-surface transition-all flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-sm">arrow_back</span>
                        Back to credentials
                    </button>
</div>
</form>
<!-- Decorative Meta Info -->
<div class="mt-12 pt-6 border-t border-outline-variant/10 flex justify-between items-center">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label text-[10px] uppercase text-outline tracking-tighter">Secure Session Active</span>
</div>
<div class="font-label text-[10px] uppercase text-outline tracking-tighter opacity-50">
                    REF-ID: 882-SCRB
                </div>
</div>
</div>
</main>
<!-- Simple Footer for transactional screen -->
<footer class="w-full py-8 px-8 border-t border-primary/5 bg-surface-container-lowest flex flex-col md:flex-row justify-between items-center gap-4">
<div class="font-label text-[10px] uppercase tracking-widest text-outline">
            © 2024 Scrubi Terminal. Precision Code Scrubbing.
        </div>
<div class="flex gap-6">
<a class="font-label text-[10px] uppercase tracking-widest text-outline hover:text-primary transition-colors" href="#">API Reference</a>
<a class="font-label text-[10px] uppercase tracking-widest text-outline hover:text-primary transition-colors" href="#">Security</a>
</div>
</footer>
</body></html>
